<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blink Decoder – Festival Morse</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: system-ui, -apple-system, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #video-container {
    position: relative;
    flex: 1;
    background: #000;
    overflow: hidden;
  }
  video, canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #roi {
    position: absolute;
    border: 2px solid #00ff88;
    border-radius: 8px;
    pointer-events: none;
    box-shadow: 0 0 14px #00ff88cc;
    display: none;
  }
  #status {
    position: absolute;
    top: 10px; left: 10px; right: 10px;
    background: rgba(0,0,0,0.78);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.35;
    z-index: 10;
  }
  #angle-info {
    position: absolute;
    top: 70px; left: 10px;
    background: rgba(0,0,0,0.7);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
